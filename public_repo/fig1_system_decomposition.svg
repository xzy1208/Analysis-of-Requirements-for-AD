<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 470" role="img">
<title>Level 0 functional decomposition of the vehicle-level ADAS</title>
<desc>Seven functions with their main data-flow backbone, four data stores, eight boundary-crossing interfaces (six inputs and two outputs), and one internal contract interface E9.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="72" width="600" height="164" rx="12" fill="#F7F7F7" stroke="#999999" stroke-width="0.5"/>
<text x="54" y="90" font-family="sans-serif" font-size="11" fill="#666666">system boundary</text>
<rect x="54" y="112" width="82" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="95" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">F1</text>
<text x="95" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">Perception</text>
<rect x="160" y="112" width="82" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="201" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">F2</text>
<text x="201" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">Prediction</text>
<rect x="266" y="112" width="82" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="307" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">F3</text>
<text x="307" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">Behaviour</text>
<rect x="372" y="112" width="82" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="413" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">F5</text>
<text x="413" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">Motion</text>
<rect x="478" y="112" width="82" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="519" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">F6</text>
<text x="519" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">Control</text>
<rect x="555" y="112" width="70" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="590" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">F7</text>
<text x="590" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">Safety</text>
<path d="M136 138 L156 138" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M242 138 L262 138" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M348 138 L368 138" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M454 138 L474 138" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 138 L551 138" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="266" y="184" width="188" height="38" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
<text x="360" y="203" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B6D11">F4 Route Planning - route to F3 and F5</text>
<path d="M307 184 L307 166" fill="none" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M413 184 L413 166" fill="none" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="54" y="258" width="586" height="92" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="68" y="278" font-family="sans-serif" font-size="12" font-weight="bold" fill="#633806">Four data stores</text>
<rect x="68" y="290" width="130" height="42" rx="8" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text x="133" y="311" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#412402">D1 HD Map</text>
<rect x="210" y="290" width="130" height="42" rx="8" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text x="275" y="311" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#412402">D2 Object Track</text>
<rect x="352" y="290" width="130" height="42" rx="8" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text x="417" y="311" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#412402">D3 Ego State</text>
<rect x="494" y="290" width="130" height="42" rx="8" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text x="559" y="311" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#412402">D4 Traffic Rules</text>
<rect x="40" y="366" width="600" height="94" rx="12" fill="#F7F7F7" stroke="#999" stroke-width="0.5"/>
<text x="54" y="386" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">Boundary-crossing interfaces (8) + internal contract interface (1)</text>
<text x="54" y="405" font-family="sans-serif" font-size="11" fill="#444">In (6): raw_sensor_data, gnss_imu, driver_intent, destination, map_data, traffic_rules</text>
<text x="54" y="422" font-family="sans-serif" font-size="11" fill="#444">Out (2): warning (from F3), checked_cmd (arbitrated by F7)</text>
<text x="54" y="439" font-family="sans-serif" font-size="11" fill="#444">E9 actuator_cmd: F6 → F7, internal (R-E-2 arbitration contract), not boundary-crossing</text>
</svg>
